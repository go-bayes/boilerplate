url: https://go-bayes.github.io/boilerplate/
template:
  bootstrap: 5
  bslib:
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto Slab"}
    code_font: {google: "Fira Code"}
    preset: "bootstrap"
authors:
  Joseph A Bulbulia:
    href: https://github.com/go-bayes
development:
  version_label: default
  version_tooltip: "Version"
vignette_engine: quarto
reference:
  - title: "Manage Databases"
    contents:
    - boilerplate_init_measures
    - boilerplate_init_text
    - boilerplate_manage_measures
    - boilerplate_manage_text
  - title: "Generate Markdown"
    contents:
    - boilerplate_generate_text
    - boilerplate_measures_text
    - boilerplate_methods_text
    - boilerplate_results_text
  - title: "Utilities"
    contents:
    - boilerplate_merge_databases
