url: https://go-bayes.github.io/boilerplate/
llm-docs: false

# ---logo -----------------------------------------------------------
logo: man/figures/logo-new.png
# -------------------------------------------------------------------

template:
  bootstrap: 5
  bootswatch: cosmo
authors:
  Joseph A Bulbulia:
    href: https://github.com/go-bayes
development:
  version_label: default
  version_tooltip: "Version"
vignette_engine: quarto
articles:
  - title: "Getting Started"
    contents:
    - boilerplate-getting-started
    - boilerplate-intro
    - boilerplate-intro-enhanced
    - boilerplate-projects
  - title: "Core Workflows"
    contents:
    - boilerplate-bibliography-workflow
    - boilerplate-measures-workflow
    - boilerplate-json-workflow
    - boilerplate-quarto-workflow
    - version-management-section
  - title: "Developer Documentation"
    contents:
    - boilerplate-architecture
    - boilerplate-internals
    - boilerplate-json-schema
reference:
  - title: "Core Database Functions"
    contents:
    - boilerplate_export
    - boilerplate_import
    - boilerplate_save
    - boilerplate_init
  - title: "Migration from RDS to JSON"
    desc: >
      Convert legacy RDS databases to JSON. RDS writing is no longer supported;
      reading is retained so that existing databases continue to load and can
      be migrated with a single call.
    contents:
    - boilerplate_migrate_to_json
    - boilerplate_rds_to_json
    - compare_rds_json
  - title: "Project Management Functions"
    contents:
    - boilerplate_copy_from_project
    - boilerplate_list_projects
  - title: "Category accessor functions"
    contents:
    - boilerplate_methods
    - boilerplate_measures
    - boilerplate_results
    - boilerplate_discussion
    - boilerplate_appendix
    - boilerplate_template
  - title: "Text generation functions"
    contents:
    - boilerplate_generate_text
    - boilerplate_generate_measures
  - title: "Path based operations"
    contents:
    - boilerplate_add_entry
    - boilerplate_update_entry
    - boilerplate_remove_entry
    - boilerplate_batch_edit
    - boilerplate_batch_edit_multi
    - boilerplate_batch_clean
    - boilerplate_get_entry
    - boilerplate_sort_db
    - boilerplate_path_exists
    - boilerplate_list_paths
  - title: "Database Health Functions"
    contents:
    - boilerplate_check_health
    - validate_json_database
  - title: "Version Management Functions"
    contents:
    - boilerplate_list_files
    - print.boilerplate_files
    - boilerplate_restore_backup
  - title: "Bibliography Functions"
    contents:
    - boilerplate_add_bibliography
    - boilerplate_update_bibliography
    - boilerplate_copy_bibliography
    - boilerplate_validate_references
  - title: "Utilities"
    contents:
    - boilerplate_find_chars
    - boilerplate_measures_report
    - boilerplate_standardise_measures
