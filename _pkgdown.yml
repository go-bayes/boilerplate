url: https://go-bayes.github.io/boilerplate/
template:
  bootstrap: 5
  bslib:
    # set the base font family using a Google Font
    base_font: {google: "Fira Code"}
    # set the font for headings
    heading_font: {google: "Fira Sans"}
    # set the font for code elements
    code_font: {google: "Fira Code"}

    # adjust the overall font size scale
    font_scale: 0.75  # makes the font smaller; 1 is the default size
    bg: "#ffffff"      # white background
    fg: "#333333"      # dark gray font color for better readability
    primary: "#007bff" # primary blue theme color for links, buttons, etc.
    secondary: "#6c757d" # secondary color (used for muted text, etc.)
    # Additional color settings for a cohesive blue theme
    info: "#17a2b8"    # info color (light blue)
    success: "#28a745" # success color (green)
    warning: "#ffc107" # warning color (yellow)
    danger: "#dc3545"  # danger color (red)
    light: "#f8f9fa"   # light color for contrasts
    dark: "#343a40"    # dark color for contrasts
authors:
  Joseph A Bulbulia:
    href: https://github.com/go-bayes
development:
  version_label: default
  version_tooltip: "Version"
vignette_engine: quarto
reference:
  - title: "Core Database Functions"
    contents:
    - boilerplate_import
    - boilerplate_save
    - boilerplate_init
    - boilerplate_init_category
  - title: "Category accessor functions"
    contents:
    - boilerplate_methods
    - boilerplate_measures
    - boilerplate_results
    - boilerplate_discussion
    - boilerplate_appendix
    - boilerplate_template
  - title: "Text generation functions"
    contents:
    - boilerplate_generate_text
    - boilerplate_generate_measures
  - title: "Path based operations"
    contents:
    - boilerplate_add_entry
    - boilerplate_update_entry
    - boilerplate_remove_entry
    - boilerplate_get_entry
    - boilerplate_sort_db
    - boilerplate_path_exists
    - boilerplate_list_paths
  - title: "Utilities"
    contents:
    - boilerplate_manage_measures
    - boilerplate_manage_text
    - boilerplate_merge_category
    - boilerplate_merge_unified
    - boilerplate_update_from_external
  - title: "Legecy Functions"
    contents:
    - boilerplate_init_text
    - boilerplate_init_measures
    - boilerplate_measures_text
    - boilerplate_merge_databases
