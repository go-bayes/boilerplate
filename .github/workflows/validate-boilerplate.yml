name: Validate Boilerplate Database

on:
  push:
    paths:
      - 'boilerplate/data/**/*.json'
      - 'inst/examples/json-poc/schema/*.json'
      - '.github/workflows/validate-boilerplate.yml'
  pull_request:
    paths:
      - 'boilerplate/data/**/*.json'
      - 'inst/examples/json-poc/schema/*.json'
  workflow_dispatch:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install JSON validation tools
      run: |
        npm install -g ajv-cli
        npm install -g jsonlint
    
    - name: Validate JSON syntax
      run: |
        echo "Checking JSON syntax..."
        find boilerplate/data -name "*.json" -type f | while read file; do
          echo "Validating syntax: $file"
          jsonlint -q "$file" || exit 1
        done
    
    - name: Validate against schemas
      run: |
        echo "Validating against schemas..."
        
        # Validate measures databases
        for file in boilerplate/data/*measures*.json; do
          if [ -f "$file" ]; then
            echo "Validating measures: $file"
            ajv validate -s inst/examples/json-poc/schema/measures_schema.json -d "$file" || exit 1
          fi
        done
        
        # Validate methods databases
        for file in boilerplate/data/*methods*.json; do
          if [ -f "$file" ]; then
            echo "Validating methods: $file"
            ajv validate -s inst/examples/json-poc/schema/methods_schema.json -d "$file" || exit 1
          fi
        done

  check-consistency:
    runs-on: ubuntu-latest
    needs: validate-json
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'
        
    - name: Install R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: |
          any::jsonlite
          any::testthat
          any::cli
          
    - name: Check database consistency
      run: |
        Rscript -e '
          library(jsonlite)
          
          # Function to check for missing references
          check_references <- function(db) {
            issues <- character()
            
            check_recursive <- function(x, path = "") {
              if (is.list(x)) {
                if ("reference" %in% names(x) && is.null(x$reference)) {
                  issues <<- c(issues, paste0(path, " has NULL reference"))
                }
                for (name in names(x)) {
                  if (name != "_meta") {
                    check_recursive(x[[name]], paste0(path, "/", name))
                  }
                }
              }
            }
            
            check_recursive(db)
            return(issues)
          }
          
          # Check all JSON files
          json_files <- list.files("boilerplate/data", pattern = "\\\\.json$", full.names = TRUE)
          
          all_issues <- character()
          
          for (file in json_files) {
            cat("Checking", basename(file), "...\n")
            db <- read_json(file)
            issues <- check_references(db)
            if (length(issues) > 0) {
              all_issues <- c(all_issues, paste0(basename(file), ": ", issues))
            }
          }
          
          if (length(all_issues) > 0) {
            cat("\nIssues found:\n")
            cat(all_issues, sep = "\n")
            quit(status = 1)
          } else {
            cat("\nAll consistency checks passed!\n")
          }
        '